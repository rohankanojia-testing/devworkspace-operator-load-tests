<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevWorkspace Operator load tests</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7;
}
@media (prefers-color-scheme: dark) {
  :root { --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
p.note { color: var(--ink-2); margin: 0 0 12px; max-width: 80ch; }
.filters { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; margin: 16px 0; padding: 12px 16px; background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; }
.filters > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cap { font-size: 12px; color: var(--ink-2); }
select, .seg label { font: inherit; color: var(--ink); }
select { background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 8px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.seg label { padding: 5px 10px; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--grid); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid #2a78d6; outline-offset: -2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 5px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.legend i { width: 14px; height: 4px; border-radius: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0; }
.card p { font-size: 12px; color: var(--ink-2); margin: 2px 0 8px; }
.plot { position: relative; height: 230px; }
.empty { padding: 24px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--axis); border-radius: 8px; margin-top: 16px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>DevWorkspace Operator load tests</h1>
  <p class="note">One chart per metric, with releases from oldest to newest along the bottom.</p>

  <div id="empty" class="empty" hidden></div>

  <div id="app" hidden>
    <div class="filters">
      <div><span class="cap">Load test</span><div class="seg" id="type"></div></div>
      <div id="mode-wrap"><span class="cap" id="mode-cap">Namespace mode</span><div class="seg" id="mode"></div></div>
      <div><label class="cap" for="last">Releases shown</label>
        <select id="last"><option value="5" selected>Last 5</option><option value="10">Last 10</option><option value="0">All</option></select></div>
      <div><span class="cap" id="legend-cap">DevWorkspaces created (one line each)</span><div class="legend" id="legend"></div></div>
    </div>
    <div id="none" class="empty" hidden></div>
    <div class="grid" id="charts"></div>
  </div>
</main>

<script src="vendor/chart.umd.min.js"></script>
<script>
(() => {
  // One entry per kind of load test. `size` is the column that says how big the run was
  // (one line per value); `group` is an optional column the reader switches between.
  // `alt` lists older names for the same column, so CSVs from earlier releases still chart.
  const TYPES = {
    controller: {
      label: 'Controller', size: 'DevWorkspaces Created', sizeLabel: 'DevWorkspaces created', sizeNoun: 'DevWorkspaces',
      group: 'Namespace', groupLabel: 'Namespace mode', prefer: 'single',
      metrics: [
        {col: 'Average CPU (milliCPU)', alt: ['Average DWO CPU (milliCPU)'], title: 'Controller CPU', unit: 'milliCPU', sub: 'Average milliCPU over the run', digits: 0},
        {col: 'Average Memory (MiB)', title: 'Controller memory', unit: 'MiB', sub: 'Average MiB over the run', digits: 0},
        {col: 'Ready Duration (Avg ms)', title: 'Time to ready', unit: 's', sub: 'Average seconds until a DevWorkspace is ready', div: 1000, digits: 1},
        {col: 'Create Duration (Avg ms)', title: 'Create request duration', unit: 'ms', sub: 'Average milliseconds per create call', digits: 1},
        {col: 'CPU Violations', title: 'CPU violations', unit: '', sub: 'Count reported by the run', digits: 0},
        {col: 'Memory Violations', title: 'Memory violations', unit: '', sub: 'Count reported by the run', digits: 0},
        {col: 'Average Etcd CPU (milliCPU)', title: 'Etcd CPU', unit: 'milliCPU', sub: 'Average milliCPU during the run', digits: 0},
        {col: 'Average Etcd Memory (MiB)', title: 'Etcd memory', unit: 'MiB', sub: 'Average MiB during the run', digits: 0},
        {col: 'Ready Failed (%)', title: 'Failed to become ready', unit: '%', sub: 'Share of DevWorkspaces that never became ready', digits: 2},
      ],
    },
    webhook: {
      label: 'Webhook', size: 'Users', sizeLabel: 'Concurrent users', sizeNoun: 'users',
      metrics: [
        {col: 'Mutating Latency (ms)', title: 'Mutating webhook latency', unit: 'ms', sub: 'Milliseconds, as reported by the run', digits: 0},
        {col: 'Validating Latency (ms)', title: 'Validating webhook latency', unit: 'ms', sub: 'Milliseconds, as reported by the run', digits: 0},
        {col: 'Exec Latency (ms)', title: 'Exec latency', unit: 'ms', sub: 'Milliseconds, as reported by the run', digits: 0},
        {col: 'Create Latency (ms)', title: 'DevWorkspace create latency', unit: 'ms', sub: 'Milliseconds, as reported by the run', digits: 2},
        {col: 'Mutation Timeouts', title: 'Mutation timeouts', unit: '', sub: 'Count reported by the run', digits: 0},
        {col: 'Validation Timeouts', title: 'Validation timeouts', unit: '', sub: 'Count reported by the run', digits: 0},
        {col: 'Exec Failed', title: 'Failed execs', unit: '', sub: 'Count reported by the run', digits: 0},
        {col: 'Webhook Restarts', title: 'Webhook server restarts', unit: '', sub: 'Count reported by the run', digits: 0},
        {col: 'Avg Webhook CPU (mCPU)', title: 'Webhook server CPU', unit: 'milliCPU', sub: 'Average milliCPU over the run', digits: 0},
        {col: 'Avg Webhook Mem (MB)', title: 'Webhook server memory', unit: 'MB', sub: 'Average MB over the run', digits: 0},
      ],
    },
    backup: {
      label: 'Backup', size: 'DW Target', sizeLabel: 'DevWorkspaces targeted', sizeNoun: 'DevWorkspaces',
      group: 'Config Type', groupLabel: 'Config type', prefer: 'openshift-internal',
      metrics: [
        {col: 'Backup Job Duration (Avg ms)', title: 'Backup job duration', unit: 'ms', sub: 'Average milliseconds per backup job', digits: 0},
        {col: 'Restore Duration (Avg ms)', title: 'Restore duration', unit: 'ms', sub: 'Average milliseconds per restore', digits: 0},
        {col: 'Backup Pods', title: 'Backup pods', unit: '', sub: 'Count reported by the run', digits: 0},
        {col: 'Backup Failed', title: 'Failed backups', unit: '', sub: 'Count reported by the run', digits: 0},
        {col: 'Restore Failed', title: 'Failed restores', unit: '', sub: 'Count reported by the run', digits: 0},
        {col: 'Average CPU (milliCPU)', title: 'Controller CPU', unit: 'milliCPU', sub: 'Average milliCPU over the run', digits: 0},
        {col: 'Average Memory (MiB)', title: 'Controller memory', unit: 'MiB', sub: 'Average MiB over the run', digits: 0},
        {col: 'Average Etcd CPU (milliCPU)', title: 'Etcd CPU', unit: 'milliCPU', sub: 'Average milliCPU during the run', digits: 0},
        {col: 'Average Etcd Memory (MiB)', title: 'Etcd memory', unit: 'MiB', sub: 'Average MiB during the run', digits: 0},
      ],
    },
  };
  // One blue ramp, light to dark, for run sizes from smallest to largest (an ordered scale, so one hue).
  const RAMP = {
    light: ['#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95', '#104281', '#0d366b'],
    dark: ['#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab'],
  };
  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
  const fmt = (v, digits) => v.toLocaleString('en-US', {minimumFractionDigits: digits, maximumFractionDigits: digits});
  const dark = matchMedia('(prefers-color-scheme: dark)');

  // data[type]: [{name, rows}], oldest release first, only the releases that have that test type.
  const data = {controller: [], webhook: [], backup: []};
  const fromHash = location.hash.slice(1);
  const state = {type: fromHash in TYPES ? fromHash : 'controller', mode: {}, last: 5};
  const charts = [];

  function parseCsv(text) {
    const lines = text.split(/\r?\n/).filter((l) => l.trim() !== '').map((l) => l.split(',').map((c) => c.trim().replace(/^"|"$/g, '')));
    if (!lines.length) return [];
    return lines.slice(1).map((r) => Object.fromEntries(lines[0].map((h, i) => [h, r[i] ?? ''])));
  }

  // Rows of one release for the current test type and, where the type has one, the chosen group.
  function rowsOf(release) {
    const t = TYPES[state.type];
    return release.rows.filter((r) => num(r[t.size]) != null && (!t.group || r[t.group] === state.mode[state.type]));
  }

  // Mean of a metric for one release and run size (repeat runs are averaged).
  function value(release, metric, size) {
    const t = TYPES[state.type];
    const vals = rowsOf(release)
      .filter((r) => num(r[t.size]) === size)
      .map((r) => num(r[[metric.col, ...(metric.alt || [])].find((c) => c in r)]))
      .filter((v) => v != null);
    return vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length / (metric.div || 1) : null;
  }

  function el(tag, props, ...kids) {
    const n = Object.assign(document.createElement(tag), props || {});
    n.append(...kids);
    return n;
  }

  function segmented(host, name, options, current, onPick) {
    host.replaceChildren(...options.map(([val, label]) => {
      const input = el('input', {type: 'radio', name, value: val, checked: val === current});
      input.addEventListener('change', () => onPick(val));
      return el('label', null, input, el('span', {textContent: label}));
    }));
  }

  function buildControls() {
    const t = TYPES[state.type];
    segmented($('type'), 'type', Object.entries(TYPES).map(([k, v]) => [k, v.label]), state.type, (k) => {
      state.type = k;
      history.replaceState(null, '', '#' + k);
      buildControls();
      render();
    });

    $('mode-wrap').hidden = !t.group;
    if (t.group) {
      const modes = [...new Set(data[state.type].flatMap((r) => r.rows.map((x) => x[t.group]).filter(Boolean)))].sort();
      if (!modes.includes(state.mode[state.type])) state.mode[state.type] = modes.includes(t.prefer) ? t.prefer : modes[0];
      $('mode-cap').textContent = t.groupLabel;
      segmented($('mode'), 'mode', modes.map((m) => [m, m]), state.mode[state.type], (m) => { state.mode[state.type] = m; render(); });
    }
    $('legend-cap').textContent = `${t.sizeLabel} (one line each)`;
    $('last').onchange = (e) => { state.last = +e.target.value; render(); };
  }

  function render() {
    charts.splice(0).forEach((c) => c.destroy());
    const t = TYPES[state.type];
    const all = data[state.type];
    $('none').hidden = all.length > 0;
    $('none').textContent = all.length ? '' : `No ${t.label.toLowerCase()} results yet. Add dashboard/results/<release>/${state.type}_load_test_results.csv and push.`;
    const shown = state.last ? all.slice(-state.last) : all;
    const sizes = [...new Set(shown.flatMap((r) => rowsOf(r).map((x) => num(x[t.size]))))].sort((a, b) => a - b);
    const ramp = RAMP[dark.matches ? 'dark' : 'light'];
    // Spread the run sizes evenly over the ramp so the smallest and largest are furthest apart.
    const color = (i) => ramp[sizes.length < 2 ? 4 : Math.round(i * (ramp.length - 1) / (sizes.length - 1))];

    $('legend').replaceChildren(...sizes.map((s, i) => {
      const swatch = el('i');
      swatch.style.background = color(i);
      return el('span', null, swatch, s.toLocaleString('en-US'));
    }));

    const tick = {color: css('--muted'), font: {size: 11}};
    const group = t.group ? `, ${state.mode[state.type]}` : '';
    $('charts').replaceChildren(...(all.length ? t.metrics : []).map((m) => {
      const canvas = el('canvas', {role: 'img', ariaLabel: `${m.title} by release, one line per number of ${t.sizeNoun}${group}`});
      const card = el('div', {className: 'card'}, el('h2', {textContent: m.title}), el('p', {textContent: m.sub}), el('div', {className: 'plot'}, canvas));
      charts.push(new Chart(canvas, {
        type: 'line',
        data: {labels: shown.map((r) => r.name), datasets: sizes.map((s, i) => ({
          label: `${s.toLocaleString('en-US')} ${t.sizeNoun}`, data: shown.map((r) => value(r, m, s)),
          borderColor: color(i), backgroundColor: color(i), borderWidth: 2,
          pointRadius: 4, pointHoverRadius: 6, pointBorderColor: css('--surface'), pointBorderWidth: 2,
          tension: 0, spanGaps: true,
        }))},
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: {mode: 'index', intersect: false},
          plugins: {
            legend: {display: false},
            tooltip: {
              itemSort: (a, b) => b.datasetIndex - a.datasetIndex,
              callbacks: {
                title: (items) => `Release ${items[0].label}`,
                label: (item) => ` ${item.dataset.label}: ${fmt(item.parsed.y, m.digits)}${m.unit ? ' ' + m.unit : ''}`,
              },
            },
          },
          scales: {
            x: {offset: true, grid: {display: false}, border: {color: css('--axis')}, ticks: tick},
            y: {beginAtZero: true, grid: {color: css('--grid')}, border: {display: false}, ticks: {...tick, maxTicksLimit: 5}},
          },
        },
      }));
      return card;
    }));
  }

  function showEmpty(text) {
    $('empty').textContent = text;
    $('empty').hidden = false;
  }

  async function load() {
    try {
      const res = await fetch('results/index.json', {cache: 'no-cache'});
      if (!res.ok) throw new Error(`results/index.json: HTTP ${res.status}`);
      const manifest = await res.json();
      await Promise.all((manifest.releases || []).flatMap((r) => Object.entries(r.files || {}).map(async ([type, file]) => {
        if (!(type in TYPES)) return;
        const csv = await fetch(file, {cache: 'no-cache'});
        if (!csv.ok) throw new Error(`${file}: HTTP ${csv.status}`);
        const rows = parseCsv(await csv.text());
        if (rows.length) data[type].push({name: r.name, rows});
      })));
      // Fetches finish in any order; put each type's releases back in manifest (version) order.
      const order = (manifest.releases || []).map((r) => r.name);
      Object.values(data).forEach((list) => list.sort((a, b) => order.indexOf(a.name) - order.indexOf(b.name)));
    } catch (err) {
      showEmpty(`Could not load the results (${err.message}). Build the site with scripts/build-site.sh and serve the _site folder.`);
      return;
    }
    if (!Object.values(data).some((list) => list.length)) {
      showEmpty('No results yet. Commit a CSV to dashboard/results/<release>/controller_load_test_results.csv and rebuild.');
      return;
    }
    $('app').hidden = false;
    buildControls();
    render();
  }

  dark.addEventListener('change', () => { if ($('app').hidden === false) render(); });
  load();
})();
</script>
</body>
</html>
